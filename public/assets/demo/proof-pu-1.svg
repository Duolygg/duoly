  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="540" cy="60" r="140" fill="#FFFFFF" opacity=".04"/>
  <circle cx="80" cy="330" r="120" fill="#FFFFFF" opacity=".04"/>
  <text x="320" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="6" fill="url(#win)">VICTORY</text>
