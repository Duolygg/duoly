  <text x="320" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" opacity=".6">:</text>
  <text x="425" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#FF8FA3">312</text>
