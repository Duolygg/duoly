name: Bug report
description: Reproducible failure without sensitive data
title: '[Bug] '
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, environment and commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and regression-test proposal
