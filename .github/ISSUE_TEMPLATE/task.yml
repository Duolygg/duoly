name: Implementation task
description: Scoped work with acceptance criteria and verification
title: '[Task] '
body:
  - type: textarea
    id: scope
    attributes:
      label: Goal, approved scope and exclusions
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, shared contracts and owner
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Tests and evidence required
    validations:
      required: true
