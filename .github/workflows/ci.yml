# Actions minute budget: label edits run only Design guard; main pushes run only Quality.
# PR docs/research-only changes skip expensive checks, but never skip Design guard.
# Browser smoke runs only on non-draft code PRs (including ready_for_review) or manual runs.
# Keep pnpm store caching in both expensive jobs; Playwright browsers ship in the container.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect code changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes outside docs and research
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Disable rename folding so moves out of code also count as code changes.
          git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/ci-changes"
          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|*.md|ai-agents-research/*|.github/dependabot.yml) ;;
              *) code=true; break ;;
            esac
          done < "$RUNNER_TEMP/ci-changes"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  quality:
    name: Quality
    needs: changes
    # !cancelled() allows push/manual runs despite the skipped PR-only detector.
    if: >-
      !cancelled() &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
  design-guard:
    name: Design guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # The homepage and shared site chrome are owner-designed. A PR that touches them needs
      # the owner to add the `design-approved` label (CONTRIBUTING.md, "Protected design").
      - name: Owner approval for homepage and site chrome changes
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'design-approved') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD" -- \
            src/pages/index.astro src/components/home src/components/site/SiteFooter.jsx \
            src/site/nav.ts src/layouts public/og)
          if [ -n "$changed" ] && [ "$APPROVED" != "true" ]; then
            echo "These owner-designed files changed without the design-approved label:"
            echo "$changed"
            exit 1
          fi
          echo "Design guard ok"
  browser:
    name: Browser smoke
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      !github.event.pull_request.draft && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    # Playwright's own image ships Chromium and its system libraries, so no apt step can hang the job.
    # Keep the tag equal to @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify production SEO, internal links and sitemap
        run: node scripts/seo-verify.mjs
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
