name: SQL tests
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/sql-tests/**'
      - 'src/server/**'
      - 'workers/**'
      - 'tests/unit/sql-test-guard.test.ts'
      - '.github/workflows/sql-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/sql-tests/**'
      - 'src/server/**'
      - 'workers/**'
      - '.github/workflows/sql-tests.yml'
  workflow_dispatch:
concurrency:
  group: sql-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Install pinned dependencies and psql
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Default Docker bridge publications to loopback
        run: |
          sudo python3 -c 'import json,pathlib; p=pathlib.Path("/etc/docker/daemon.json"); d=json.loads(p.read_text()) if p.exists() else {}; d["ip"]="127.0.0.1"; p.write_text(json.dumps(d))'
          sudo systemctl restart docker
      - name: Start local Supabase and apply ordered migrations
        run: |
          test "$(node_modules/.bin/supabase --version)" = "$(node -p 'require("./package.json").devDependencies.supabase')"
          node_modules/.bin/supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime
      - name: Assert local PostgreSQL extensions and migrations
        run: |
          docker exec supabase_db_duoly psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select count(*) from pg_extension where extname in ('pg_cron','pg_net','http','supabase_vault')) <> 4 then raise exception 'Required extensions missing'; end if; if to_regclass('public.duoly_dispatch_state') is null then raise exception 'Latest migration missing'; end if; end \$\$;"
      - name: Run guarded manifest suites
        run: node scripts/sql-tests/run.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sql-test-results
          path: sql-test-results.json
      - name: Stop disposable stack
        if: always()
        run: node_modules/.bin/supabase stop --no-backup
