version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Keep Node types aligned with the Node 24 runtime until it is upgraded.
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
